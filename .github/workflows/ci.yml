name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run gates

  macos-probe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: |
          mkdir -p config
          echo "{\"$(hostname)\":\"desktop\"}" > config/hosts.json
      - run: ./factory-probe | bun run scripts/contracts-check.ts host-capacity -

  rust-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.99.1
      - run: bun run gates:rs
      - run: bun install --frozen-lockfile
      - run: cargo build --release --locked
      - run: |
          mkdir -p pkg/bin pkg/config
          cp target/release/moc-host-state pkg/bin/moc-host-state
          cp config/plugin.json pkg/config/plugin.json
          cp config/probe.json pkg/config/probe.json
      - run: echo '{"hostAlias":"desktop"}' > live-facts.json
      - run: |
          ./factory-probe --facts live-facts.json > ts.json
          pkg/bin/moc-host-state --facts live-facts.json > rs.json
      - run: bun run scripts/probe-live-compare.ts ts.json rs.json

  rust-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.99.1
      - run: bun run gates:rs
      - run: bun install --frozen-lockfile
      - run: cargo build --release --locked
      - run: |
          mkdir -p pkg/bin pkg/config
          cp target/release/moc-host-state pkg/bin/moc-host-state
          cp config/plugin.json pkg/config/plugin.json
          cp config/probe.json pkg/config/probe.json
      - run: echo '{"hostAlias":"desktop"}' > live-facts.json
      - run: |
          ./factory-probe --facts live-facts.json > ts.json
          pkg/bin/moc-host-state --facts live-facts.json > rs.json
      - run: bun run scripts/probe-live-compare.ts ts.json rs.json
